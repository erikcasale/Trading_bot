services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    env_file: .env
    depends_on:
      - mongo
    restart: unless-stopped
    expose:
      - "8001"

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        REACT_APP_BACKEND_URL: "https://${DOMAIN}"
    environment:
      - DOMAIN=${DOMAIN}
      - ACME_EMAIL=${ACME_EMAIL:-admin@example.com}
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mongo_data:
  caddy_data:
  caddy_config:
